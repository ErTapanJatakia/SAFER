name: SAFER browser cross-tab validation

on:
  pull_request:
    paths:
      - 'src/lib/demoRepository.ts'
      - 'src/data/mockData.ts'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - '.github/workflows/browser-cross-tab.yml'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'src/lib/demoRepository.ts'
      - 'src/data/mockData.ts'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - '.github/workflows/browser-cross-tab.yml'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  chromium-cross-tab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-browser cross-tab tests
        run: npx playwright test --config=playwright.config.mjs
