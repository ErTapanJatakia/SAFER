name: SAFER dependency and build validation

on:
  push:
    branches:
      - "feature/*"
      - "security/*"
      - "fix/*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "src/**"
      - "tests/**"
      - "firestore.rules"
      - "firebase.json"
      - "vercel.json"
      - "public/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/firebase-foundation.yml"
  pull_request:
    branches:
      - main
      - "fix/*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "src/**"
      - "tests/**"
      - "firestore.rules"
      - "firebase.json"
      - "vercel.json"
      - "public/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/firebase-foundation.yml"

permissions:
  contents: write

concurrency:
  group: safer-dependency-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only

      - name: Install from frozen Bun lockfile
        run: bun install --frozen-lockfile
      - name: Install Chromium for browser validation
        run: bunx playwright install --with-deps chromium

      - name: Vercel browser security header policy tests
        run: node --test tests/vercel-security-headers.test.mjs

      - name: Cloudflare Pages browser security header policy tests
        run: node --test tests/cloudflare-security-headers.test.mjs

      - name: Firestore Security Rules Emulator tests
        run: npm run test:firestore-rules

      - name: Tenant membership resolver Emulator tests
        run: npm run test:tenant-membership

      - name: AuthGate membership UI tests
        run: npm run test:auth-membership-ui

      - name: Authenticated account security lifecycle tests
        run: npm run test:account-security

      - name: Accessibility preferences UI tests
        run: npm run test:accessibility-preferences

      - name: Modal focus accessibility tests
        run: npm run test:modal-focus-a11y

      - name: Accessibility preferences modal focus tests
        run: npm run test:accessibility-modal-focus

      - name: Personnel export modal focus tests
        run: npm run test:personnel-export-modal-focus

      - name: Summary modal focus tests
        run: npm run test:summary-modal-focus

      - name: Incident and pre-deployment modal focus tests
        run: npm run test:incident-predeployment-modal-focus

      - name: Cyber Hygiene control editor modal focus tests
        run: npm run test:cyber-item-modal-focus

      - name: Dashboard accessibility and empty-state tests
        run: npm run test:dashboard-ui

      - name: Operational form accessible-name tests
        run: npm run test:operational-form-accessible-names

      - name: Searchable multi-select accessibility tests
        run: npm run test:searchable-multiselect

      - name: Navbar accessibility tests
        run: npm run test:navbar-accessibility

      - name: Live announcement accessibility tests
        run: npm run test:live-announcer

      - name: Accessibility text scaling tests
        run: npm run test:text-scaling

      - name: Filter control accessibility tests
        run: npm run test:filter-control-accessibility

      - name: Cyber Hygiene tabs, phishing lab, and filter accessibility tests
        run: npm run test:cyber-hygiene-tabs

      - name: Responsive operational form layout tests
        run: npm run test:responsive-forms

      - name: Responsive dashboard and checklist layout tests
        run: npm run test:responsive-dashboard

      - name: Responsive operational view layout tests
        run: npm run test:responsive-operational-views

      - name: Responsive modal layout tests
        run: npm run test:responsive-modals

      - name: Responsive settings and personnel modal tests
        run: npm run test:responsive-settings-modals

      - name: Responsive detail and readiness modal tests
        run: npm run test:responsive-detail-modals

      - name: Responsive readiness and incident action tests
        run: npm run test:responsive-readiness-incident-actions

      - name: Long-content operational readability tests
        run: npm run test:long-content-reflow

      - name: Checklist and cyber content readability tests
        run: npm run test:checklist-cyber-content

      - name: Pre-deployment summary content readability tests
        run: npm run test:predeployment-summary-content

      - name: Readiness scenario and sign-off readability tests
        run: npm run test:readiness-scenario-signoff

      - name: Incident report content readability tests
        run: npm run test:incident-report-content

      - name: Header banner narrow-screen readability tests
        run: npm run test:header-banner-reflow

      - name: Structured incident draft content readability tests
        run: npm run test:incident-draft-content

      - name: Cyber hygiene briefing narrow-screen readability tests
        run: npm run test:cyber-hygiene-briefing

      - name: Mobile navigation accessibility tests
        run: npm run test:navbar-mobile-accessibility

      - name: Theme preset keyboard accessibility tests
        run: npm run test:theme-preset-accessibility

      - name: Custom theme colour control accessibility tests
        run: npm run test:theme-custom-color-accessibility

      - name: Branding logo upload accessibility tests
        run: npm run test:branding-logo-upload-accessibility

      - name: Branding settings form accessibility tests
        run: npm run test:branding-settings-form-accessibility

      - name: Branding upload announcement accessibility tests
        run: npm run test:branding-announcements

      - name: Branding tab selected-state accessibility tests
        run: npm run test:branding-tab-state

      - name: Branding corner-position accessibility tests
        run: npm run test:branding-corner-position

      - name: Branding modal button accessibility tests
        run: npm run test:branding-modal-buttons

      - name: Branding secondary button accessibility tests
        run: npm run test:branding-secondary-buttons

      - name: Cyber Hygiene briefing content tests
        run: npm run test:cyber-hygiene-briefing

      - name: Operational data-boundary unit tests
        run: npm run test:data-boundary

      - name: Demo Guest repository tests
        run: npm run test:demo-repository

      - name: Demo Guest storage failure-boundary tests
        run: npm run test:demo-storage-boundary

      - name: Demo Guest confirmed UI persistence tests
        run: npm run test:demo-ui-persistence

      - name: Demo Guest conflict recovery export tests
        run: npm run test:demo-conflict-export

      - name: Demo Guest retention notice tests
        run: npm run test:demo-retention-notice

      - name: Demo Guest repository-boundary tests
        run: npm run test:demo-workspace

      - name: Session lifecycle invalidation tests
        run: npm run test:session-lifecycle

      - name: Cross-tab session invalidation tests
        run: npm run test:session-invalidation

      - name: Real Chromium cross-tab repository tests
        run: npm run test:browser-cross-tab

      - name: Real Chromium Demo Guest conflict recovery UI tests
        run: npx playwright test --config=playwright.config.mjs tests/browser/demo-conflict-ui.spec.mjs

      - name: Security assessment and export regression tests
        run: npm run test:security-assessment

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit regenerated lockfiles
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json bun.lock
            git commit -m "chore: synchronize dependency lockfiles"
            git push
          fi
