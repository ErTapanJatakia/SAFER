name: SAFER dependency and build validation

on:
  push:
    branches:
      - security/sheetjs-0203-remediation
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "src/**"
      - ".github/workflows/firebase-foundation.yml"

permissions:
  contents: write

concurrency:
  group: safer-dependency-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate package lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          bun install --lockfile-only

      - name: Install from npm lockfile
        run: npm ci

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit regenerated lockfiles
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json bun.lock
            git commit -m "chore: synchronize dependency lockfiles"
            git push
          fi
