name: SAFER dependency and build validation

on:
  push:
    branches:
      - "feature/*"
      - "security/*"
      - "fix/*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "src/**"
      - "tests/**"
      - "firestore.rules"
      - "firebase.json"
      - "vercel.json"
      - "docs/**"
      - ".github/workflows/firebase-foundation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "src/**"
      - "tests/**"
      - "firestore.rules"
      - "firebase.json"
      - "vercel.json"
      - "docs/**"
      - ".github/workflows/firebase-foundation.yml"

permissions:
  contents: write

concurrency:
  group: safer-dependency-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only

      - name: Install from frozen Bun lockfile
        run: bun install --frozen-lockfile

      - name: Vercel browser security header policy tests
        run: node --test tests/vercel-security-headers.test.mjs

      - name: Firestore Security Rules Emulator tests
        run: npm run test:firestore-rules

      - name: Tenant membership resolver Emulator tests
        run: npm run test:tenant-membership

      - name: AuthGate membership UI tests
        run: npm run test:auth-membership-ui

      - name: Accessibility preferences UI tests
        run: npm run test:accessibility-preferences

      - name: Screen-reader live announcement tests
        run: npm run test:live-announcer

      - name: Operational data-boundary unit tests
        run: npm run test:data-boundary

      - name: Demo Guest repository tests
        run: npm run test:demo-repository

      - name: Demo Guest repository-boundary tests
        run: npm run test:demo-workspace

      - name: Session lifecycle invalidation tests
        run: npm run test:session-lifecycle

      - name: Cross-tab session invalidation tests
        run: npm run test:session-invalidation

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit regenerated lockfiles
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json bun.lock
            git commit -m "chore: synchronize dependency lockfiles"
            git push
          fi
